name: CI

# Every pull request: lint, typecheck, test, and build. Releases happen in
# release.yml when a version bump merges to main.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built entry points load as plain ESM, as a consumer's bundler sees them.
      - run: node --input-type=module -e "await import('./dist/core/index.js'); await import('./dist/react/index.js');"
